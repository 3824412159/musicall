name: SuoziMusic
options:
  bundleIdPrefix: com.musicdl
  deploymentTarget:
    iOS: "15.0"
targets:
  SuoziMusic:
    type: application
    platform: iOS
    sources:
      - path: SuoziMusic
    info:
      path: SuoziMusic/Info.plist
      properties:
        CFBundleDisplayName: "锁子音乐"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSHumanReadableCopyright: "SuoziMusic Study Demo"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musicdl.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
